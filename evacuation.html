<style>

  * { box-sizing:border-box; margin:0; padding:0; }

  .splash .co { color:var(--gray); font-size:.85em; letter-spacing:2px; font-weight:bold; }
  .splash .ti-en { color:var(--dark); font-size:1.6em; font-weight:bold; margin:10px 0 4px; }

  .langbar { text-align:right; padding:10px 16px 0; }
  .langbar button { font-family:Arial; border:2px solid var(--blue); background:#fff; color:var(--blue); padding:6px 14px; font-weight:bold; cursor:pointer; border-radius:4px; margin-left:6px; font-size:.95em; }

  .opt.wrong { border-color:var(--red); background:#fdecec; }
  .fb { font-weight:bold; margin-top:8px; display:none; }

  .fb.bad { color:var(--red); display:block; }
  .qnum { color:var(--gray); font-size:.85em; }

  .quizq .qt { font-weight:bold; margin-bottom:6px; }

  .failmsg { color:var(--red); font-weight:bold; font-size:1.2em; }

en: {
  basedOn: "Based on the SDS Lumber Emergency Action and Fire Prevention Plan v3.0 (WAC 296-24-567). Questions? Contact your supervisor or the Safety/Environmental Compliance Manager.",
  introH: "Welcome \u2014 Emergency Evacuation at SDS Lumber",
  introP1: "When something goes wrong at the mill \u2014 a fire, a spill, any emergency \u2014 what saves lives is one hundred people doing the same simple things: report it, move when told, go to the muster point, get counted, and stay out until it's safe. This training teaches you exactly those things.",
  introP2: "The training takes about 15 minutes. You must score 80% or better on the final quiz to receive credit. You may retake the quiz if needed.",
  nameLabel: "Enter your full name to begin:",
  namePh: "First and last name",
  startBtn: "Start Training",
  continueBtn: "Continue",
  checkBtn: "Check Answer",

  secLabel: "Section",

  sections: [
    { h:"1. The Plan in One Sentence", body:
      "<p>SDS Lumber's Emergency Action and Fire Prevention Plan exists so that fires and emergencies never turn into missing people. The whole plan, in one sentence:</p>"+
      "<p><b>When an evacuation is ordered, everyone goes to the muster point, everyone is counted, and no one re-enters until the Emergency Coordinator gives the all-clear.</b></p>"+
      "<p>An <b>Emergency Coordinator (EC)</b> is one of seven trained managers \u2014 led by the General Manager \u2014 who take charge during any emergency, order evacuations, and call 911 and the fire department. Your supervisor knows how to reach them at any hour.</p>"+
      "<p>Everything else in this training is the detail behind that one sentence.</p>",
      kc:{ q:"During an evacuation, when may you go back into the facility?", opts:["As soon as the fire trucks arrive","Once your area looks safe to you","Only when the Emergency Coordinator gives the all-clear","After 30 minutes"], a:2 } },

    { h:"2. Reporting \u2014 Your Supervisor First, Immediately", body:
      "<p>See a fire, a spill, or any emergency? <b>Tell your supervisor immediately</b> \u2014 by radio, phone, or in person. Every supervisor carries a radio and a cell phone.</p>"+
      "<p>Your supervisor immediately notifies the Emergency Coordinator, who takes charge: calling 911, bringing in the fire department, and deciding whether to evacuate.</p>"+
      "<p><b>Every fire gets reported \u2014 even one you already put out.</b> A small fire that was extinguished still tells us something was wrong, and it still gets checked.</p>"+
      "<p>Don't investigate, don't gather more information first, don't wait to be sure it's \u201cserious enough.\u201d Report first. Let the people whose job it is decide what it is.</p>",
      kc:{ q:"You put out a small trash-can fire with an extinguisher. What now?", opts:["Nothing \u2014 it's out","Report it to your supervisor immediately","Mention it at the end of your shift","Refill the extinguisher yourself"], a:1 } },

    { h:"3. How You'll Be Notified \u2014 The Radio Relay", body:
      "<p>You will not hear a horn. In a sawmill, horns and sirens can't be heard reliably over running machinery \u2014 so SDS Lumber uses a <b>radio relay system</b> instead:</p>"+
      "<ol><li>The Emergency Coordinator broadcasts the evacuation order on the plant radio channel, naming the muster point: <b>\u201cPrimary\u201d or \u201cAlternate.\u201d</b></li>"+
      "<li>Your supervisor hears it and comes to you <b>face-to-face</b>: tells you to move and where.</li>"+
      "<li><b>You relay it too</b> \u2014 tell every co-worker you pass. Nobody waits for a second notice.</li></ol>"+
      "<p><b>Working alone</b> in the log yard, at the far kilns, or in a remote spot? Your supervisor is responsible for reaching you individually \u2014 by radio, phone, or in person. Always make sure your supervisor knows where you're working.</p>",
      kc:{ q:"How are you told to evacuate at SDS Lumber?", opts:["A plant-wide siren sounds","Your supervisor tells you face-to-face after the radio broadcast \u2014 and you relay it to others","A text message from the office","The lights flash"], a:1 } },

    { h:"4. The Two Muster Points", body:
      "<p>SDS Lumber has two fixed muster points. The Emergency Coordinator's radio call names which one:</p>"+
      "<table class='mini'><tr><th>Call</th><th>Where you go</th></tr>"+
      "<tr><td><b>\u201cPRIMARY\u201d</b></td><td><b>LeTourneau Shop Parking Lot</b> \u2014 the northeast corner of the facility. This is the default: unless you're told otherwise, this is where you go.</td></tr>"+
      "<tr><td><b>\u201cALTERNATE\u201d</b></td><td><b>Stud Mill Parking Lot</b> \u2014 south of the Walnut Street exit. Used when the emergency involves the northeast end of the facility.</td></tr></table>"+

      "<p><b>Do not move your vehicle.</b> Cars leaving during an evacuation clog the exact roads the fire trucks need. Vehicles stay parked until the Emergency Coordinator releases everyone.</p>" },

    { h:"5. At the Muster Point \u2014 Get Counted", body:
      "<p>The count is the whole point. At the muster point:</p>"+
      "<ul><li><b>Form up with your department and your supervisor</b> \u2014 they count you against the crew roster.</li>"+
      "<li>Stay inside the lot; keep the roadway and gate clear for fire trucks.</li>"+
      "<li><b>Never leave the muster point without checking out with your supervisor.</b> If you leave uncounted, someone may risk their life looking for you.</li></ul>"+
      "<p>If a co-worker is missing, <b>tell your supervisor or the Emergency Coordinator immediately \u2014 and never go back in to search.</b> The missing person's name and last known location go straight to the fire department. Rescue is their job, with their equipment and their training.</p>",
      kc:{ q:"You're at the muster point and realize a co-worker isn't there. What do you do?", opts:["Go back in and look for them","Wait \u2014 they'll probably show up","Tell your supervisor or the Emergency Coordinator immediately; never re-enter to search","Call their cell phone and keep it to yourself"], a:2 } },

    { h:"6. Fire Extinguishers \u2014 You're Trained, Know the Limits", body:
      "<p>Every SDS Lumber employee is trained to use portable fire extinguishers \u2014 at hire and every year. Remember <b>PASS</b>: Pull the pin, Aim at the base, Squeeze, Sweep.</p>"+
      "<p><b>You MAY fight a fire only when ALL of these are true:</b> it's small and contained (like a waste container), it's not spreading, you have a clear escape route behind you, the right extinguisher is at hand \u2014 and it gets reported to your supervisor either way.</p>"+
      "<p><b>You do NOT fight a fire when:</b> it's bigger than incipient stage or spreading \u00b7 it involves the chip piles, fuel tanks, or a structure \u00b7 smoke or heat threatens your way out \u00b7 or your extinguisher empties and the fire still burns \u2014 <b>one extinguisher, one attempt, then leave.</b></p>"+
      "<p><b>When in doubt, get out</b> \u2014 and report it.</p>",
      kc:{ q:"Your extinguisher runs empty and the fire is still burning. You should\u2026", opts:["Grab a second extinguisher and keep trying","Leave immediately \u2014 one extinguisher, one attempt \u2014 and make sure it's reported","Throw water on it","Try to smother it with a jacket"], a:1 } },

    { h:"7. Preventing the Fire in the First Place", body:
      "<p>At a sawmill, fire prevention is a daily habit, not an annual event:</p>"+
      "<ul><li><b>Housekeeping:</b> trash, scrap, and waste wood leave every shift. Keep sawdust from piling up around motors, bearings, and electrical gear.</li>"+
      "<li><b>Hot work</b> (welding, cutting, grinding) requires a permit under the Hot Work Program \u2014 no exceptions.</li>"+
      "<li><b>Smoke only in designated areas.</b></li>"+
      "<li><b>Damaged extinguisher or missing equipment?</b> Report it \u2014 extinguishers are inspected monthly, and your eyes between inspections matter.</li></ul>"+
      "<p><b>One more thing you should know:</b> no employee has rescue or medical duties under this plan \u2014 that's 911 and Skyline Hospital, minutes away. Your job in an emergency is the one this training taught: report, move, muster, count in, stay out. The written plan lives in the Safety Office, the main office, and the lunchroom \u2014 read it any time.</p>" }

es: {
  basedOn: "Basado en el Plan de Acci\u00f3n de Emergencia y Prevenci\u00f3n de Incendios de SDS Lumber v3.0 (WAC 296-24-567). \u00bfPreguntas? Consulte a su supervisor o al Gerente de Seguridad/Cumplimiento Ambiental.",
  introH: "Bienvenido \u2014 Evacuaci\u00f3n de Emergencia en SDS Lumber",
  introP1: "Cuando algo sale mal en el aserradero \u2014 un incendio, un derrame, cualquier emergencia \u2014 lo que salva vidas es que cien personas hagan las mismas cosas simples: reportarlo, moverse cuando se lo indiquen, ir al punto de reuni\u00f3n, ser contado y quedarse afuera hasta que sea seguro. Esta capacitaci\u00f3n le ense\u00f1a exactamente esas cosas.",

    { h:"1. El Plan en Una Frase", body:
      "<p>El Plan de Acci\u00f3n de Emergencia y Prevenci\u00f3n de Incendios de SDS Lumber existe para que los incendios y las emergencias nunca se conviertan en personas desaparecidas. Todo el plan, en una frase:</p>"+
      "<p><b>Cuando se ordena una evacuaci\u00f3n, todos van al punto de reuni\u00f3n, todos son contados, y nadie vuelve a entrar hasta que el Coordinador de Emergencia da la se\u00f1al de que todo est\u00e1 despejado.</b></p>"+
      "<p>Un <b>Coordinador de Emergencia (EC)</b> es uno de siete gerentes capacitados \u2014 encabezados por el Gerente General \u2014 que toman el mando durante cualquier emergencia, ordenan evacuaciones y llaman al 911 y a los bomberos. Su supervisor sabe c\u00f3mo contactarlos a cualquier hora.</p>"+
      "<p>Todo lo dem\u00e1s en esta capacitaci\u00f3n es el detalle detr\u00e1s de esa frase.</p>",
      kc:{ q:"Durante una evacuaci\u00f3n, \u00bfcu\u00e1ndo puede volver a entrar a la planta?", opts:["En cuanto lleguen los camiones de bomberos","Cuando su \u00e1rea le parezca segura","Solo cuando el Coordinador de Emergencia d\u00e9 la se\u00f1al de despejado","Despu\u00e9s de 30 minutos"], a:2 } },

    { h:"2. Reportar \u2014 Su Supervisor Primero, de Inmediato", body:
      "<p>\u00bfVe un incendio, un derrame o cualquier emergencia? <b>Avise a su supervisor de inmediato</b> \u2014 por radio, tel\u00e9fono o en persona. Cada supervisor lleva radio y tel\u00e9fono celular.</p>"+
      "<p>Su supervisor notifica de inmediato al Coordinador de Emergencia, quien toma el mando: llama al 911, trae a los bomberos y decide si hay que evacuar.</p>"+
      "<p><b>Todo incendio se reporta \u2014 incluso uno que usted ya apag\u00f3.</b> Un fuego peque\u00f1o que se apag\u00f3 igual nos dice que algo estaba mal, y igual se revisa.</p>"+
      "<p>No investigue, no re\u00fana m\u00e1s informaci\u00f3n primero, no espere a estar seguro de que es \u201clo suficientemente serio.\u201d Reporte primero.</p>",
      kc:{ q:"Apag\u00f3 un fuego peque\u00f1o en un bote de basura con un extintor. \u00bfAhora qu\u00e9?", opts:["Nada \u2014 ya est\u00e1 apagado","Rep\u00f3rtelo a su supervisor de inmediato","Lo menciona al final de su turno","Rellena el extintor usted mismo"], a:1 } },

    { h:"3. C\u00f3mo le Avisar\u00e1n \u2014 El Relevo por Radio", body:
      "<p>Usted no escuchar\u00e1 una sirena. En un aserradero, las sirenas no se escuchan de manera confiable sobre la maquinaria en marcha \u2014 por eso SDS Lumber usa un <b>sistema de relevo por radio</b>:</p>"+
      "<ol><li>El Coordinador de Emergencia transmite la orden de evacuaci\u00f3n por el canal de radio de la planta, nombrando el punto de reuni\u00f3n: <b>\u201cPrimary\u201d (Primario) o \u201cAlternate\u201d (Alterno).</b></li>"+
      "<li>Su supervisor la escucha y viene a usted <b>cara a cara</b>: le dice que se mueva y a d\u00f3nde.</li>"+
      "<li><b>Usted tambi\u00e9n lo transmite</b> \u2014 av\u00edsele a cada compa\u00f1ero que encuentre. Nadie espera un segundo aviso.</li></ol>"+
      "<p>\u00bf<b>Trabaja solo</b> en el patio de troncos, en los hornos lejanos o en un lugar apartado? Su supervisor es responsable de avisarle individualmente \u2014 por radio, tel\u00e9fono o en persona. Aseg\u00farese siempre de que su supervisor sepa d\u00f3nde est\u00e1 trabajando.</p>",
      kc:{ q:"\u00bfC\u00f3mo le avisan que debe evacuar en SDS Lumber?", opts:["Suena una sirena en toda la planta","Su supervisor se lo dice cara a cara despu\u00e9s de la transmisi\u00f3n por radio \u2014 y usted se lo transmite a otros","Un mensaje de texto de la oficina","Las luces parpadean"], a:1 } },

    { h:"4. Los Dos Puntos de Reuni\u00f3n", body:
      "<p>SDS Lumber tiene dos puntos de reuni\u00f3n fijos. La llamada de radio del Coordinador de Emergencia nombra cu\u00e1l:</p>"+
      "<table class='mini'><tr><th>Llamada</th><th>A d\u00f3nde va</th></tr>"+
      "<tr><td><b>\u201cPRIMARY\u201d</b></td><td><b>Estacionamiento del Taller LeTourneau</b> \u2014 la esquina noreste de la planta. Este es el punto por defecto: a menos que le digan lo contrario, aqu\u00ed es donde va.</td></tr>"+
      "<tr><td><b>\u201cALTERNATE\u201d</b></td><td><b>Estacionamiento del Stud Mill</b> \u2014 al sur de la salida de la calle Walnut. Se usa cuando la emergencia involucra el extremo noreste de la planta.</td></tr></table>"+
      "<p>Las rutas de evacuaci\u00f3n est\u00e1n publicadas en su \u00e1rea de trabajo. Camine r\u00e1pido, no corra, y ayude a quien lo necesite en el camino.</p>"+

      "<p><b>No mueva su veh\u00edculo.</b> Los autos saliendo durante una evacuaci\u00f3n congestionan exactamente los caminos que necesitan los camiones de bomberos. Los veh\u00edculos se quedan estacionados hasta que el Coordinador de Emergencia libere a todos.</p>" },

    { h:"5. En el Punto de Reuni\u00f3n \u2014 Sea Contado", body:
      "<p>El conteo es el prop\u00f3sito de todo. En el punto de reuni\u00f3n:</p>"+
      "<ul><li><b>Form\u00e9se con su departamento y su supervisor</b> \u2014 ellos lo cuentan contra la lista del equipo.</li>"+
      "<li>Qu\u00e9dese dentro del estacionamiento; mantenga el camino y la entrada despejados para los camiones de bomberos.</li>"+
      "<li><b>Nunca se vaya del punto de reuni\u00f3n sin avisarle a su supervisor.</b> Si se va sin ser contado, alguien puede arriesgar su vida busc\u00e1ndolo.</li></ul>"+
      "<p>Si falta un compa\u00f1ero, <b>d\u00edgale a su supervisor o al Coordinador de Emergencia de inmediato \u2014 y nunca vuelva a entrar a buscar.</b> El nombre y la \u00faltima ubicaci\u00f3n conocida de la persona van directamente a los bomberos. El rescate es trabajo de ellos, con su equipo y su entrenamiento.</p>",
      kc:{ q:"Est\u00e1 en el punto de reuni\u00f3n y se da cuenta de que falta un compa\u00f1ero. \u00bfQu\u00e9 hace?", opts:["Vuelve a entrar a buscarlo","Espera \u2014 probablemente aparecer\u00e1","Avisa a su supervisor o al Coordinador de Emergencia de inmediato; nunca vuelve a entrar a buscar","Le llama al celular y no le dice a nadie"], a:2 } },

    { h:"6. Extintores \u2014 Est\u00e1 Capacitado, Conozca los L\u00edmites", body:
      "<p>Cada empleado de SDS Lumber est\u00e1 capacitado para usar extintores port\u00e1tiles \u2014 al ser contratado y cada a\u00f1o. Recuerde <b>PASS</b>: Pull (jale el seguro), Aim (apunte a la base), Squeeze (apriete), Sweep (barra).</p>"+
      "<p><b>PUEDE combatir un fuego solo cuando TODO esto es cierto:</b> es peque\u00f1o y contenido (como un bote de basura), no se est\u00e1 extendiendo, tiene una ruta de escape despejada detr\u00e1s de usted, el extintor correcto est\u00e1 a la mano \u2014 y se reporta a su supervisor de cualquier manera.</p>"+
      "<p><b>NO combata un fuego cuando:</b> es m\u00e1s grande que su etapa inicial o se extiende \u00b7 involucra las pilas de astillas, los tanques de combustible o una estructura \u00b7 el humo o el calor amenazan su salida \u00b7 o su extintor se vac\u00eda y el fuego sigue \u2014 <b>un extintor, un intento, y luego salga.</b></p>"+
      "<p><b>En caso de duda, salga</b> \u2014 y rep\u00f3rtelo.</p>",
      kc:{ q:"Su extintor se vac\u00eda y el fuego sigue ardiendo. Usted debe\u2026", opts:["Agarrar un segundo extintor y seguir intentando","Salir de inmediato \u2014 un extintor, un intento \u2014 y asegurarse de que se reporte","Echarle agua","Tratar de sofocarlo con una chamarra"], a:1 } },

    { h:"7. Prevenir el Incendio Desde el Principio", body:
      "<p>En un aserradero, la prevenci\u00f3n de incendios es un h\u00e1bito diario, no un evento anual:</p>"+
      "<ul><li><b>Limpieza:</b> la basura, los desechos y la madera de desperdicio salen cada turno. Evite que el aserr\u00edn se acumule alrededor de motores, rodamientos y equipo el\u00e9ctrico.</li>"+
      "<li>El <b>trabajo en caliente</b> (soldar, cortar, esmerilar) requiere un permiso bajo el Programa de Trabajo en Caliente \u2014 sin excepciones.</li>"+
      "<li><b>Fume solo en las \u00e1reas designadas.</b></li>"+
      "<li>\u00bf<b>Extintor da\u00f1ado o equipo faltante?</b> Rep\u00f3rtelo \u2014 los extintores se inspeccionan mensualmente, y sus ojos entre inspecciones importan.</li></ul>"+
      "<p><b>Una cosa m\u00e1s que debe saber:</b> ning\u00fan empleado tiene deberes de rescate o m\u00e9dicos bajo este plan \u2014 eso es el 911 y el Hospital Skyline, a minutos de distancia. Su trabajo en una emergencia es el que esta capacitaci\u00f3n le ense\u00f1\u00f3: reportar, moverse, reunirse, ser contado, quedarse afuera. El plan escrito est\u00e1 en la Oficina de Seguridad, la oficina principal y el comedor \u2014 puede leerlo cuando quiera.</p>" }
  ],
  quizH: "Examen Final",
  quizIntro: "Responda las 10 preguntas. Necesita 8 correctas (80%) para aprobar. T\u00f3mese su tiempo \u2014 puede revisar sus respuestas antes de enviar.",
  submitBtn: "Enviar Examen",
  answerAll: "Por favor responda todas las preguntas antes de enviar.",
  quiz: [
    { q:"Ve un fuego comenzando cerca de un transportador. Su PRIMERA acci\u00f3n es\u2026", opts:["Terminar su tarea y luego mencionarlo","Reportarlo a su supervisor de inmediato","Publicarlo en el chat del grupo","Investigar para ver qu\u00e9 tan grave es"], a:1 },
    { q:"\u00bfC\u00f3mo se ordena una evacuaci\u00f3n en SDS Lumber?", opts:["Una sirena en toda la planta","El Coordinador de Emergencia transmite por radio, y los supervisores lo comunican cara a cara","Un correo a todos los empleados","Luces parpadeando en cada edificio"], a:1 },
    { q:"La llamada de radio dice \u201cPrimary.\u201d \u00bfA d\u00f3nde va?", opts:["A la oficina principal","Al estacionamiento del Stud Mill","Al estacionamiento del Taller LeTourneau en la esquina noreste","Al patio de troncos"], a:2 },
    { q:"La llamada de radio dice \u201cAlternate.\u201d \u00bfA d\u00f3nde va?", opts:["Al estacionamiento del Stud Mill, al sur de la salida de la calle Walnut","A su auto","Al comedor","A la planta de vapor"], a:0 },
    { q:"Durante una evacuaci\u00f3n, su veh\u00edculo\u2026", opts:["Debe sacarse por la puerta de inmediato","Se queda estacionado hasta que el Coordinador de Emergencia libere a todos","Puede moverse si est\u00e1 cerca del fuego","Debe usarse para llevar compa\u00f1eros al punto de reuni\u00f3n"], a:1 },
    { q:"En el punto de reuni\u00f3n, usted debe\u2026", opts:["Dispersarse y esperar donde sea","Formarse con su departamento para que su supervisor lo cuente \u2014 y nunca irse sin avisar","Irse a casa si su turno casi termina","Pararse en el camino para se\u00f1alar a los camiones de bomberos"], a:1 },
    { q:"Falta un compa\u00f1ero en el punto de reuni\u00f3n. Usted\u2026", opts:["Corre a buscarlo adentro","Avisa a su supervisor o al Coordinador de Emergencia de inmediato \u2014 nunca vuelve a entrar","Supone que se fue a casa","Espera diez minutos antes de decir algo"], a:1 },
    { q:"Puede combatir un fuego con un extintor solo cuando\u2026", opts:["Es peque\u00f1o y contenido, no se extiende, tiene ruta de escape despejada, y se reporta","Se siente lo suficientemente valiente","Est\u00e1 en la pila de astillas","No hay un supervisor cerca"], a:0 },
    { q:"Su extintor se vac\u00eda y el fuego sigue. Usted\u2026", opts:["Consigue otro extintor y contin\u00faa","Sale de inmediato \u2014 un extintor, un intento","Espera a ver si se apaga","Aparta el humo y mira m\u00e1s de cerca"], a:1 },
    { q:"Apag\u00f3 un fuego peque\u00f1o por completo. \u00bfLo reporta?", opts:["No \u2014 no queda nada que reportar","Solo si algo se da\u00f1\u00f3","S\u00ed \u2014 todo incendio se reporta a su supervisor, incluso uno que usted apag\u00f3","Solo en las reuniones de seguridad"], a:2 }
  ],
  passH:"\u00a1Felicidades \u2014 Aprob\u00f3!",
  passSub:"Certificado de Finalizaci\u00f3n",
  passModule:"Evacuaci\u00f3n de Emergencia \u2014 Capacitaci\u00f3n del Empleado " + MODULE_VERSION,
  scoreLabel:"Puntaje",
  dateLabel:"Fecha",
  codeLabel:"Su c\u00f3digo de finalizaci\u00f3n",
  passInstr:"<b>\u00daltimo paso \u2014 registre su finalizaci\u00f3n:</b> toque el bot\u00f3n de abajo y env\u00ede el formulario de finalizaci\u00f3n. Escriba su nombre, seleccione <b>\"Emergency Evacuation / Evacuaci\u00f3n de Emergencia\"</b> de la lista de m\u00f3dulos, y escriba el c\u00f3digo de finalizaci\u00f3n que aparece arriba. Su capacitaci\u00f3n no queda registrada hasta que env\u00ede el formulario.",
  recordBtn:"Registrar Mi Finalizaci\u00f3n",
  failH:"Todav\u00eda No \u2014 Siga Adelante",
  failMsg:"Obtuvo menos de 80%. Revise el material \u2014 especialmente los dos puntos de reuni\u00f3n, el relevo por radio y los l\u00edmites de los extintores \u2014 e intente de nuevo. No hay l\u00edmite de intentos.",
  reviewBtn:"Revisar el Material",
  retakeBtn:"Repetir el Examen",
  yourScore:"Su puntaje"
}
};

var ANSWER_KEY = STR.en.quiz.map(function(q){ return q.a; });

/* ------------ State ------------ */
var state = { lang:null, screen:"lang", section:0, name:"", kcDone:{}, quizAnswers:{}, lastScore:null, code:null };

/* ------------ Helpers ------------ */
function T(){ return STR[state.lang]; }
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

function generateCode(){
  var chars="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out="";
  for(var i=0;i<5;i++){ out+=chars.charAt(Math.floor(Math.random()*chars.length)); }
  return CODE_PREFIX+out;
}
function gradeQuiz(answers){
  var correct=0;
  for(var i=0;i<ANSWER_KEY.length;i++){ if(answers[i]===ANSWER_KEY[i]) correct++; }
  var pct=Math.round(correct/ANSWER_KEY.length*100);
  return { correct:correct, total:ANSWER_KEY.length, pct:pct, pass: pct>=PASS_PCT };
}

/* ------------ Rendering ------------ */
function setLang(l){
  state.lang=l;
  if(state.screen==="lang") state.screen="intro";
  $("langBar").className="langbar";
  $("btnEN").className = l==="en"?"active":"";
  $("btnES").className = l==="es"?"active":"";
  render();
}
function progress(){
  if(state.screen==="lang"){ $("progBar").style.width="0%"; return; }
  var total = T().sections.length + 2;
  var pos = state.screen==="intro"?0 : state.screen==="quiz"?total-1 : state.screen==="pass"||state.screen==="fail"?total : state.section+1;
  $("progBar").style.width = Math.round(pos/total*100)+"%";
}
function renderLang(){
  $("app").innerHTML =
    '<div class="card splash">'+
    '<div class="co">SDS LUMBER COMPANY LLC</div>'+
    '<div class="ti-en">Emergency Evacuation Training</div>'+
    '<div class="ti-es">Capacitación sobre Evacuación de Emergencia</div>'+
    '<div class="choose">Choose your language / Elija su idioma:</div>'+
    '<div class="langbtns">'+
    '<button id="langBtnEN">English</button>'+
    '<button id="langBtnES">Español</button>'+
    '</div></div>';
  $("langBtnEN").addEventListener("click", function(){ setLang("en"); });
  $("langBtnES").addEventListener("click", function(){ setLang("es"); });
}
function render(){
  progress();
  if(state.screen==="lang") renderLang();
  else if(state.screen==="intro") renderIntro();
  else if(state.screen==="section") renderSection();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="pass") renderPass();
  else if(state.screen==="fail") renderFail();
}
function renderIntro(){
  var t=T();
  $("app").innerHTML =
    '<div class="card"><h1>'+t.introH+'</h1><p>'+t.introP1+'</p><p>'+t.introP2+'</p>'+
    '<h2>'+t.nameLabel+'</h2>'+
    '<input type="text" id="nameInput" placeholder="'+t.namePh+'" value="'+esc(state.name)+'" autocomplete="name">'+
    '<br><button class="btn" id="startBtn" disabled>'+t.startBtn+'</button>'+
    '<p style="color:var(--gray);font-size:.85em;margin-top:16px">'+t.basedOn+'</p></div>';
  var inp=$("nameInput"), btn=$("startBtn");
  function gate(){ state.name=inp.value.trim(); btn.disabled = state.name.length<2; }
  inp.addEventListener("input", gate); gate();
  btn.addEventListener("click", function(){ if(state.name.length>=2){ state.screen="section"; state.section=0; render(); window.scrollTo(0,0);} });
}
function renderSection(){
  var t=T(), s=t.sections[state.section];
  var html = '<div class="card"><div class="qnum">'+t.secLabel+' '+(state.section+1)+' '+t.ofLabel+' '+t.sections.length+'</div><h1>'+s.h+'</h1>'+s.body;
  var kcPassed = !!state.kcDone[state.section];
  if(s.kc){
    html += '<div class="kc"><div class="kct">✔ '+s.kc.q+'</div>';
    for(var i=0;i<s.kc.opts.length;i++){
      html += '<label class="opt" id="kcOpt'+i+'"><input type="radio" name="kc" value="'+i+'"'+(kcPassed?' disabled':'')+'>'+s.kc.opts[i]+'</label>';
    }
    html += '<div class="fb" id="kcFb"></div>';
    if(!kcPassed) html += '<button class="btn secondary" id="kcCheck">'+t.checkBtn+'</button>';
    html += '</div>';
  }
  html += '<br><button class="btn" id="contBtn"'+((s.kc&&!kcPassed)?' disabled':'')+'>'+t.continueBtn+'</button></div>';
  $("app").innerHTML = html;
  if(s.kc && !kcPassed){
    $("kcCheck").addEventListener("click", function(){
      var sel=document.querySelector('input[name="kc"]:checked');
      if(!sel) return;
      var v=parseInt(sel.value,10), fb=$("kcFb");
      if(v===s.kc.a){
        state.kcDone[state.section]=true;
        $("kcOpt"+v).className="opt correct";
        fb.className="fb ok"; fb.textContent=t.kcOk;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      } else {
        $("kcOpt"+v).className="opt wrong";
        $("kcOpt"+s.kc.a).className="opt correct";
        fb.className="fb bad"; fb.textContent=t.kcBad;
        state.kcDone[state.section]=true;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      }
    });
  }
  $("contBtn").addEventListener("click", function(){
    if(state.section < t.sections.length-1){ state.section++; } else { state.screen="quiz"; }
    render(); window.scrollTo(0,0);
  });
}
function renderQuiz(){
  var t=T();
  var html='<div class="card"><h1>'+t.quizH+'</h1><p>'+t.quizIntro+'</p>';
  for(var i=0;i<t.quiz.length;i++){
    var q=t.quiz[i];
    html+='<div class="quizq"><div class="qt">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.opts.length;j++){
      var checked = state.quizAnswers[i]===j ? ' checked' : '';
      html+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+checked+'>'+q.opts[j]+'</label>';
    }
    html+='</div>';
  }
  html+='<div class="fb bad" id="quizWarn" style="display:none">'+t.answerAll+'</div>';
  html+='<button class="btn" id="quizSubmit">'+t.submitBtn+'</button></div>';
  $("app").innerHTML=html;
  var radios=document.querySelectorAll('#app input[type=radio]');
  for(var r=0;r<radios.length;r++){
    radios[r].addEventListener("change", function(e){
      var name=e.target.name, idx=parseInt(name.substring(1),10);
      state.quizAnswers[idx]=parseInt(e.target.value,10);
    });
  }
  $("quizSubmit").addEventListener("click", function(){
    var answers=[];
    for(var i=0;i<t.quiz.length;i++){
      if(typeof state.quizAnswers[i]==="undefined"){ $("quizWarn").style.display="block"; return; }
      answers.push(state.quizAnswers[i]);
    }
    var res=gradeQuiz(answers);
    state.lastScore=res;
    if(res.pass){ state.code=generateCode(); state.screen="pass"; }
    else { state.screen="fail"; }
    render(); window.scrollTo(0,0);
  });
}
function fmtDate(){
  var d=new Date();
  var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var mes=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return state.lang==="es" ? d.getDate()+" "+mes[d.getMonth()]+" "+d.getFullYear() : m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function renderPass(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card"><p class="passmsg">'+t.passH+'</p></div>'+
    '<div class="cert" id="certBox">'+
      '<div>'+t.passSub+'</div>'+
      '<div class="big" id="certName">'+esc(state.name)+'</div>'+
      '<div>'+t.passModule+'</div>'+
      '<div style="margin:8px 0">'+t.scoreLabel+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b> &nbsp;·&nbsp; '+t.dateLabel+': <b id="certDate">'+fmtDate()+'</b></div>'+
      '<div>'+t.codeLabel+':</div>'+
      '<div class="code" id="certCode">'+state.code+'</div>'+
    '</div>'+
    '<div class="card"><p>'+t.passInstr+'</p>'+
    '<a class="btn" id="recordLink" href="'+FORM_URL+'" target="_blank" rel="noopener">'+t.recordBtn+'</a></div>';
}
function renderFail(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card" id="failBox"><p class="failmsg">'+t.failH+'</p>'+
    '<p>'+t.yourScore+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b></p>'+
    '<p>'+t.failMsg+'</p>'+
    '<button class="btn secondary" id="reviewBtn">'+t.reviewBtn+'</button> '+
    '<button class="btn" id="retakeBtn">'+t.retakeBtn+'</button></div>';
  $("reviewBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="section"; state.section=0; render(); window.scrollTo(0,0); });
  $("retakeBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="quiz"; render(); window.scrollTo(0,0); });
}

/* ------------ Test hooks ------------ */
window.APP = { STR:STR, state:state, gradeQuiz:gradeQuiz, generateCode:generateCode, ANSWER_KEY:ANSWER_KEY, FORM_URL:FORM_URL, PASS_PCT:PASS_PCT, MODULE_VERSION:MODULE_VERSION, CODE_PREFIX:CODE_PREFIX, setLang:setLang, render:render };
window.setLang = setLang;

render();
</script>
</body>
</html>
