<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDS Lumber — Emergency Evacuation SUPERVISOR Training</title>
<style>
  :root { --blue:#2E75B6; --dark:#1F4E79; --gray:#666; --light:#F2F2F2;
          --green:#2E8B57; --amber:#E8A317; --orange:#D2691E; --red:#B22222; --maroon:#701C1C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:var(--light); color:#222; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 24px rgba(0,0,0,.08); }
  header { background:var(--dark); color:#fff; padding:14px 20px; }
  header .co { font-weight:bold; font-size:15px; letter-spacing:.5px; }
  header .prog { font-size:12px; color:#cfe0f0; }
  .badge { display:inline-block; background:var(--amber); color:#2b1c00; font-weight:bold; font-size:11px; letter-spacing:1px; padding:2px 8px; border-radius:999px; margin-top:5px; }
  .bar { height:6px; background:#dce7f2; } .bar span { display:block; height:100%; background:var(--blue); width:0%; transition:width .3s; }
  main { flex:1; padding:24px 20px 32px; }
  h1 { color:var(--dark); font-size:24px; margin-bottom:12px; }
  p { margin-bottom:12px; font-size:16px; }
  ul, ol { margin:0 0 12px 22px; } li { margin-bottom:7px; font-size:16px; }
  .eyebrow { text-transform:uppercase; letter-spacing:1.5px; font-size:11px; color:var(--gray); font-weight:bold; margin-bottom:6px; }
  .card { background:var(--light); border-left:4px solid var(--blue); padding:12px 14px; margin:14px 0; border-radius:0 6px 6px 0; font-size:15px; }
  .card.warn { border-left-color:var(--red); }
  .card.do { border-left-color:var(--green); }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:15px; font-size:17px; font-weight:bold; font-family:inherit; cursor:pointer; margin-top:18px; }
  .btn:active { background:var(--dark); } .btn:disabled { background:#b9c8d6; cursor:default; }
  .btn.secondary { background:#fff; color:var(--blue); border:2px solid var(--blue); }
  a.btn { text-decoration:none; text-align:center; box-sizing:border-box; }
  input[type=text] { width:100%; padding:13px; font-size:17px; font-family:inherit; border:2px solid #c6d4e2; border-radius:8px; margin-top:6px; }
  input[type=text]:focus { outline:none; border-color:var(--blue); }
  label { font-weight:bold; font-size:14px; color:var(--dark); }
  .ladder { margin:16px 0; }
  .rung { display:flex; border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .rung .lvl { flex:0 0 112px; color:#fff; font-weight:bold; padding:10px 8px; font-size:13px; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .rung .lvl small { font-weight:normal; font-size:11px; opacity:.9; }
  .rung .act { flex:1; background:var(--light); padding:10px 12px; font-size:14px; display:flex; align-items:center; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #c6d4e2; border-radius:8px; padding:13px 14px; font-size:16px; font-family:inherit; margin-top:10px; cursor:pointer; }
  .opt.sel { border-color:var(--blue); background:#eaf2fa; }
  .opt.right { border-color:var(--green); background:#e8f5ee; }
  .opt.wrong { border-color:var(--red); background:#fbeaea; }
  .feedback { margin-top:12px; padding:12px 14px; border-radius:8px; font-size:15px; display:none; }
  .feedback.good { background:#e8f5ee; border-left:4px solid var(--green); display:block; }
  .feedback.bad { background:#fbeaea; border-left:4px solid var(--red); display:block; }
  .qnum { font-size:12px; color:var(--gray); font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .cert { border:3px solid var(--dark); border-radius:10px; padding:22px; text-align:center; margin-top:16px; }
  .cert .big { font-size:22px; font-weight:bold; color:var(--dark); margin:8px 0; }
  .cert .code { font-size:26px; letter-spacing:3px; font-weight:bold; color:var(--blue); background:var(--light); border-radius:8px; padding:10px; margin:12px 0; }
  .score-pill { display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:6px 18px; font-weight:bold; font-size:18px; }
  .score-pill.fail { background:var(--red); }
  .steps { counter-reset:s; list-style:none; margin-left:0; }
  .steps li { counter-increment:s; position:relative; padding-left:34px; margin-bottom:10px; }
  .steps li:before { content:counter(s); position:absolute; left:0; top:1px; background:var(--blue); color:#fff; width:24px; height:24px; border-radius:50%; text-align:center; font-weight:bold; font-size:14px; line-height:24px; }
  table.mini { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  table.mini th { background:var(--blue); color:#fff; padding:8px; text-align:left; }
  table.mini td { border:1px solid #d9e2ec; padding:8px; vertical-align:top; }
  table.mini tr:nth-child(even) td { background:var(--light); }
  footer { padding:12px 20px; font-size:11px; color:var(--gray); text-align:center; border-top:1px solid #e4e9ef; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="co">SDS LUMBER COMPANY LLC</div>
    <div class="prog">Emergency Action &amp; Fire Prevention — WAC 296-24-567</div>
    <div class="badge">SUPERVISOR MODULE</div>
  </header>
  <div class="bar"><span id="prog"></span></div>
  <main id="main"></main>
  <footer>SDS Lumber LLC · Bingen, WA · WAC 296-24-567 · Supervisor Module v1.0 (2026)</footer>
</div>

<script>
const FORM_URL = "https://forms.cloud.microsoft/r/z73DFxatx4";

let empName = "", slideIdx = 0, quizIdx = 0, quizScore = 0;

const slides = [
{ t:'content', eyebrow:'Section 1 of 9', title:'Your Relay IS the Alarm System', html:
  `<p>At SDS Lumber, there is no plant-wide horn — mill noise defeats it. Under our plan, <b>the radio-based supervisor relay is the facility's employee alarm system</b> (WAC 296-24-567(3)). That means when the Emergency Coordinator broadcasts an evacuation order, <b>you are the alarm</b> for your crew.</p>
  <p>The system only works at the speed of its slowest supervisor. Your two speed obligations:</p>
  <ul><li>Any report of fire or emergency from your crew goes to the <b>Emergency Coordinator immediately</b> — before investigating, before walking over to look.</li>
  <li>Any evacuation broadcast turns into <b>face-to-face notice to your crew immediately</b> — you relay, you move them.</li></ul>` },

{ t:'content', eyebrow:'Section 2 of 9', title:'The Emergency Coordinators', html:
  `<p>Seven trained Emergency Coordinators carry 24-hour contact duty with 15-minute response: <b>Chris Childers (General Manager — Main EC)</b>, plus alternates Brian Weir (Mill Superintendent), Taylor Gross (Dry Kiln Supervisor), James Patterson (Steam Plant Manager), Mike Dennis (Maintenance Manager), Kevin Lueders (Fleet Manager), and Vernon Buchanan (Safety/Environmental Compliance Manager).</p>
  <p>The EC who takes an incident: activates the radio notification, calls 911 and the fire department, orders and directs the evacuation, runs the accounting, meets arriving fire personnel, and gives the only valid all-clear. The full roster with numbers is Appendix A of the plan — keep it current in your radio memory and your phone.</p>` },

{ t:'check', q:'One of your crew radios you: "small fire by the edger, I think I got it with an extinguisher." Your next move is:',
  opts:['Walk over and confirm it is really out first','Notify the Emergency Coordinator immediately — then go look','Tell them good job and log it at end of shift','Nothing — extinguished fires do not need reporting'], a:1,
  why:'Correct. Speed is the supervisor\u2019s obligation: the EC is notified at once, before investigating. Every fire is reported — even an extinguished one — and the EC decides what it is.' },

{ t:'content', eyebrow:'Section 3 of 9', title:'Relay, Sweep, and Shut Down As You Go', html:
  `<p>When the evacuation broadcast comes, your area drill is:</p>
  <ol><li><b>Relay face-to-face.</b> Tell your crew: "Evacuate — Primary" (or Alternate). Do not rely on anyone having heard anything.</li>
  <li><b>Sweep your area</b> as you move — restrooms, break corners, cab of every running machine, anywhere a person could be with ear protection on and their back turned.</li>
  <li><b>Shut down as you go.</b> Operators stop equipment and close valves at hand only when safe on the way out. Nobody stays behind for a shutdown, and nobody goes back for one. No SDS process requires continued operation.</li></ol>` },

{ t:'check', q:'During your evacuation sweep, an operator wants to stay two minutes to finish a proper shutdown sequence. You:',
  opts:['Let them — proper shutdowns matter','Stay with them so they are not alone','Order them out now — quick actions only if safe on the way out; no process requires continued operation','Ask the EC for permission on the radio'], a:2,
  why:'Correct. The plan is explicit: no plant process requires continued operation during an evacuation. Quick shutdown actions happen only when safe on the way out — nobody delays, nobody returns.' },

{ t:'content', eyebrow:'Section 4 of 9', title:'Lone Workers Are Yours to Reach', html:
  `<p>The relay system has one soft spot: the employee who is not standing near their crew — alone in the log yard, at the far kilns, in a remote corner. The plan closes that gap with one sentence: <b>supervisors are responsible for knowing where their lone workers are and notifying them individually</b> — by radio, phone, or in person.</p>
  <p>Make it a habit, not an emergency skill: know where every member of your crew is working right now. During a drill or a real evacuation, your headcount is only as good as your answer to "where's the one who isn't here?"</p>` },

{ t:'content', eyebrow:'Section 5 of 9', title:'The Two Muster Points — and the One-Word Call', html:
  `<p>The EC's broadcast names the muster point with one word:</p>
  <ul><li><b>"PRIMARY"</b> — LeTourneau Shop Parking Lot, northeast corner. The default.</li>
  <li><b>"ALTERNATE"</b> — Stud Mill Parking Lot, south of the Walnut Street exit. Used when the emergency involves the northeast end.</li></ul>
  <p>Rules you enforce on arrival: crews form up by department inside the lot · roadway, gate approaches, and fire lanes stay clear — the Bingen Fire Department picks its own entrance · <b>nobody moves a vehicle</b> until the EC releases the site · nobody leaves without checking out with you.</p>` },

{ t:'check', q:'At the Primary muster point, an employee wants to move his pickup "out of the way of the fire trucks." You:',
  opts:['Let him — it sounds helpful','Move it yourself instead','No vehicles move until the EC releases the site — mustered people on foot, roads clear for apparatus','Only if he is fast about it'], a:2,
  why:'Correct. Vehicles leaving during an evacuation clog the exact roads the fire department needs. The rule has no exceptions: parked until the EC releases everyone.' },

{ t:'content', eyebrow:'Section 6 of 9', title:'The Headcount — Your Central Duty', html:
  `<p>At muster, your job is the count:</p>
  <ol><li>Count your crew <b>against your roster</b> — who is scheduled and working right now, including anyone borrowed or loaned between departments.</li>
  <li>Report to the EC in one of two forms: <b>"[Department] — all accounted"</b> or <b>"[Department] — missing [name(s)], last known location [where]."</b></li>
  <li>Office staff bring the visitor and contractor sign-in sheet and account for every non-employee.</li></ol>
  <p><b>Missing person = report to the EC immediately.</b> The EC hands the name, count, and last known location to the fire department. <b>No one — including you — re-enters to search.</b> Rescue belongs to the people with air packs and thermal cameras.</p>` },

{ t:'check', q:'Your count comes up one short. The missing employee was last seen at the barker. You:',
  opts:['Jog back to the barker to check — you know the fastest route','Report "missing [name], last known at the barker" to the EC immediately and stay with your crew','Send two employees together to look','Wait five minutes in case they are walking slow'], a:1,
  why:'Correct. The name and last known location go to the EC — and through the EC to the fire department — immediately. Nobody re-enters to search, supervisors included. That rule has saved more rescuers than it has ever cost victims.' },

{ t:'content', eyebrow:'Section 7 of 9', title:'The Blocked-Crossing Contingency — Know It Cold', html:
  `<p>The Walnut Street crossing is the primary vehicle exit. If a full site evacuation is ever ordered while <b>a stopped train blocks that crossing</b>, the way out is:</p>
  <p><b>East on Marine Drive to the rail underpass, about one-half mile east of the mill.</b></p>
  <p>The plan puts this knowledge on you by name: <i>supervisors are responsible for knowing this route without prompting.</i> In that scenario the radio may be saturated and the EC occupied — your crew follows you, and you already know the answer. A blocked crossing during an emergency also gets reported to BNSF immediately (emergency number and the crossing's DOT number are in Appendix A).</p>` },

{ t:'content', eyebrow:'Section 8 of 9', title:'Extinguishers — You Set the Judgment Standard', html:
  `<p>Every employee is trained annually on extinguishers, and every employee may attempt an <b>incipient-stage fire only</b>: small, contained, not spreading, clear escape route, right extinguisher, reported.</p>
  <p>Your role is the judgment line. Back your people off when the fire is beyond incipient, involves chip piles, fuel, or structure, or when smoke threatens the exit. Enforce the ironclad rule: <b>one extinguisher, one attempt, then leave.</b> And after any use — even a success — the extinguisher is reported and swapped, and the fire is reported to the EC. Extinguishers in your area are inspected monthly; treat a missing or damaged bottle as a hazard report.</p>` },

{ t:'content', eyebrow:'Section 9 of 9', title:'Drills, Records, and Your Signature', html:
  `<p>The plan requires a <b>full evacuation drill at least annually</b> — radio notification, relay, evacuation, complete accounting including visitors. Every drill is documented on the Evacuation Drill Record (plan Appendix B): times to muster and full accountability, radio performance by area, problems found, corrective actions with owners.</p>
  <p>Your part: run your relay and headcount exactly as you would in a real event, and give honest feedback on what failed — a drill that finds problems is a drill that worked.</p>
  <p>Training records: employees complete this system's employee module (or the paper test you grade); retraining is required when duties or the plan change. When your crew's paper tests are graded, record them through the SDS Training Completion form, same as every other module. The written plan lives in the Safety Office, the main office, and the lunchroom.</p>` }
];

const quiz = [
 { q:'Under the SDS plan, the facility\u2019s employee alarm system is:',
   opts:['A plant-wide horn','The radio-based supervisor relay — you are the alarm for your crew','Strobe lights in each building','A phone tree run by the office'], a:1 },
 { q:'An employee reports a fire to you. Before anything else, you:',
   opts:['Walk over to assess it','Notify the Emergency Coordinator immediately','Pull the nearest extinguisher and head over','Ask the employee how big it is and wait for details'], a:1 },
 { q:'The evacuation broadcast names the muster point with:',
   opts:['GPS coordinates','A one-word call: "Primary" or "Alternate"','A color code','The name of the nearest street'], a:1 },
 { q:'"Primary" means:',
   opts:['The Stud Mill parking lot','The main office lobby','The LeTourneau Shop parking lot, northeast corner','Wherever the EC is standing'], a:2 },
 { q:'Your sweep-and-relay during an evacuation includes:',
   opts:['Face-to-face notice, sweeping restrooms and machine cabs, and shutdown-as-you-go only when safe','Sending a group text and heading out','Waiting at the muster point for your crew to arrive','Locking your area doors first'], a:0 },
 { q:'Lone workers in the log yard or far kilns are notified of an evacuation by:',
   opts:['The general radio broadcast — they will hear it eventually','Their supervisor, individually — by radio, phone, or in person','A co-worker who happens by','The end-of-shift meeting'], a:1 },
 { q:'The correct headcount report to the EC is:',
   opts:['"We\u2019re mostly here"','"[Department] — all accounted" or "[Department] — missing [name], last known location [where]"','A written list turned in the next day','A thumbs-up across the lot'], a:1 },
 { q:'Your count is one short. You:',
   opts:['Re-enter to search — you know the layout best','Report the name and last known location to the EC immediately; no one re-enters to search','Send the two biggest guys in together','Recount three times before saying anything'], a:1 },
 { q:'A stopped train blocks the Walnut Street crossing during a full site evacuation. The egress is:',
   opts:['Wait for the train to move','Cross between the rail cars carefully','East on Marine Drive to the rail underpass, about a half mile east of the mill','Swim'], a:2 },
 { q:'An employee\u2019s extinguisher empties and the fire still burns. The rule you enforce is:',
   opts:['Grab the next bottle and continue','One extinguisher, one attempt, then leave — and the fire is reported to the EC','Form a bucket line','Wait and watch it from close by'], a:1 }
];

const main = document.getElementById('main');
const progEl = document.getElementById('prog');
const totalSteps = slides.length + quiz.length + 2;
function setProg(n){ progEl.style.width = Math.min(100, Math.round(n/totalSteps*100)) + '%'; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showStart(){
  setProg(0);
  main.innerHTML = `
    <div class="eyebrow">SDS Lumber LLC · Safety Department</div>
    <h1>Emergency Evacuation — Supervisor Training</h1>
    <p>Required supervisor training under WAC 296-24-567 and the SDS Emergency Action &amp; Fire Prevention Plan v3.0. About 15 minutes.</p>
    <div class="card warn"><b>Complete the employee Emergency Evacuation module first.</b> This module covers your additional duties as a supervisor — it does not replace the employee training, and both are required of you.</div>
    <div class="card">Pass the 10-question quiz with <b>80% or better</b> to finish. You'll get a completion code and a button to record it.</div>
    <label for="nm">Enter your full name to begin</label>
    <input type="text" id="nm" autocomplete="name" placeholder="First and last name">
    <button class="btn" id="startBtn" disabled>Start Supervisor Training</button>`;
  const nm=document.getElementById('nm'), b=document.getElementById('startBtn');
  nm.addEventListener('input', ()=>{ b.disabled = nm.value.trim().split(/\s+/).length < 2; });
  b.addEventListener('click', ()=>{ empName=nm.value.trim(); slideIdx=0; showSlide(); });
}

function showSlide(){
  if (slideIdx >= slides.length){ quizIdx=0; quizScore=0; showQuizIntro(); return; }
  setProg(1+slideIdx);
  const s = slides[slideIdx];
  if (s.t === 'content'){
    main.innerHTML = `<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1>${s.html}
      <button class="btn" id="nextBtn">Continue</button>`;
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  } else {
    main.innerHTML = `<div class="eyebrow">Knowledge Check</div><h1>Quick Question</h1><p><b>${esc(s.q)}</b></p>
      <div id="opts"></div><div class="feedback" id="fb"></div>
      <button class="btn" id="nextBtn" style="display:none">Continue</button>`;
    const optsEl=document.getElementById('opts');
    s.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.addEventListener('click', ()=>{
        const fb=document.getElementById('fb');
        [...optsEl.children].forEach(c=>c.disabled=true);
        if (i===s.a){ b.classList.add('right'); fb.className='feedback good'; fb.textContent=s.why;
          document.getElementById('nextBtn').style.display='block'; }
        else { b.classList.add('wrong'); fb.className='feedback bad'; fb.textContent='Not quite — take another look and try again.';
          setTimeout(()=>{ [...optsEl.children].forEach(c=>{c.disabled=false;c.classList.remove('wrong');}); fb.className='feedback'; },1600); }
      });
      optsEl.appendChild(b);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  }
}

function showQuizIntro(){
  setProg(1+slides.length);
  main.innerHTML = `<div class="eyebrow">Final Quiz</div>
    <h1>Ready, ${esc(empName.split(' ')[0])}?</h1>
    <p>10 questions. You need <b>8 correct (80%)</b> to pass. If you don't pass, review the material and retake it.</p>
    <button class="btn" id="goBtn">Begin Quiz</button>
    <button class="btn secondary" id="revBtn">Review Material First</button>`;
  document.getElementById('goBtn').addEventListener('click', ()=>{ showQuizQ(); window.scrollTo(0,0); });
  document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
}

function showQuizQ(){
  if (quizIdx >= quiz.length){ showResult(); return; }
  setProg(1+slides.length+quizIdx);
  const qq = quiz[quizIdx];
  main.innerHTML = `<div class="qnum">Question ${quizIdx+1} of ${quiz.length}</div>
    <h1 style="font-size:20px">${esc(qq.q)}</h1><div id="opts"></div>
    <button class="btn" id="subBtn" disabled>Submit Answer</button>`;
  const optsEl=document.getElementById('opts');
  let sel=-1;
  qq.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.addEventListener('click', ()=>{ sel=i; [...optsEl.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('subBtn').disabled=false; });
    optsEl.appendChild(b);
  });
  document.getElementById('subBtn').addEventListener('click', ()=>{
    if (sel===qq.a) quizScore++;
    quizIdx++; showQuizQ(); window.scrollTo(0,0);
  });
}

function completionCode(){
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let h=0; const src=empName.toUpperCase()+ds+quizScore+'SUP';
  for (let i=0;i<src.length;i++){ h=((h<<5)-h+src.charCodeAt(i))|0; }
  return 'EV26S-' + Math.abs(h).toString(36).toUpperCase().slice(0,5).padStart(5,'0');
}

function showResult(){
  setProg(totalSteps);
  const pct = Math.round(quizScore/quiz.length*100);
  const passed = pct >= 80;
  const dateStr = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if (passed){
    main.innerHTML = `<div class="eyebrow">Training Complete</div><h1>Congratulations!</h1>
      <p style="text-align:center"><span class="score-pill">Score: ${pct}%</span></p>
      <div class="cert">
        <div class="eyebrow">Certificate of Completion</div>
        <div class="big">${esc(empName)}</div>
        <p>has completed <b>Emergency Evacuation SUPERVISOR Training</b><br>per WAC 296-24-567</p>
        <p><b>${dateStr}</b> · Score: <b>${quizScore}/${quiz.length} (${pct}%)</b></p>
        <div class="code">${completionCode()}</div>
        <p style="font-size:13px;color:var(--gray)">SDS Lumber LLC · Bingen, WA</p>
      </div>
      <div class="card"><b>Final step — record your completion:</b> Tap the button below to open the SDS Training Completion form. Select the module <b>Emergency Evacuation — Supervisor / Evacuación de Emergencia — Supervisor</b>, enter today's date, your score, and the completion code above, then submit. Screenshot this screen for your own records. Your training is not documented until the form is submitted.</div>
      <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Record My Completion</a>`;
  } else {
    main.innerHTML = `<div class="eyebrow">Quiz Result</div><h1>Not Quite — Let's Try Again</h1>
      <p style="text-align:center"><span class="score-pill fail">Score: ${pct}%</span></p>
      <p>You need 80% to pass. Review the material and take the quiz again — your crew is counting on you knowing this cold.</p>
      <button class="btn" id="revBtn">Review Material</button>
      <button class="btn secondary" id="retryBtn">Retake Quiz Now</button>`;
    document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
    document.getElementById('retryBtn').addEventListener('click', ()=>{ quizIdx=0; quizScore=0; showQuizQ(); window.scrollTo(0,0); });
  }
}

/* test hooks */
window.APP = { slides, quiz, FORM_URL, completionCode, showStart,
  get state(){ return { empName, slideIdx, quizIdx, quizScore }; },
  setName(n){ empName = n; }, setScore(s){ quizScore = s; },
  showResult, showSlide, showQuizQ, showQuizIntro };

showStart();
</script>
</body>
</html>
